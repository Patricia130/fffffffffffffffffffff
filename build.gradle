// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.8.22' // atualizar para Kotlin moderno

    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // suporte a libs populares
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2' // AGP atualizado
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
        classpath 'com.google.gms:google-services:4.3.15' // google-services atualizado
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // flatDir removido conforme a recomendação para Gradle 7+
    }
}

// Tarefa para limpar build
task clean(type: Delete) {
    delete rootProject.buildDir
}
